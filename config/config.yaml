# Configuration unique du robot. Tout paramètre inconnu ou hors bornes bloque le démarrage.
mode: demo                 # demo | live (live exige CONFIRM_LIVE_TRADING=OUI)
timeframe: 1h
cycle_seconds: 60

platforms:
  binance:
    enabled: true
    trading_url_demo: https://demo-api.binance.com
    trading_url_live: https://api.binance.com
    market_data_url: https://api.binance.com     # les prix pour décider viennent du vrai marché
    stop_limit_offset_pct: 0.5
  capital:
    enabled: true
    url_demo: https://demo-api-capital.backend-capital.com
    url_live: https://api-capital.backend-capital.com
    keepalive_minutes: 5

markets:
  - { platform: binance, symbol: BTCUSDT, strategy: breakout,       sides: [buy] }
  - { platform: binance, symbol: ETHUSDT, strategy: trend_ema,      sides: [buy] }
  - { platform: binance, symbol: SOLUSDT, strategy: mean_reversion, sides: [buy] }
  - { platform: capital, symbol: EURUSD,  strategy: mean_reversion, sides: [buy, sell] }
  - { platform: capital, symbol: GBPUSD,  strategy: trend_ema,      sides: [buy, sell] }
  - { platform: capital, symbol: GOLD,    strategy: breakout,       sides: [buy, sell] }

strategies:
  trend_ema:
    ema_fast: 20
    ema_slow: 50
    ema_filter: 200
    adx_min: 20
    stop_atr: 2.0
    target_atr: 3.0
  mean_reversion:
    rsi_period: 14
    rsi_entry: 30
    rsi_exit: 55
    bb_period: 20
    bb_std: 2.0
    adx_max: 25
    stop_atr: 1.5
  breakout:
    lookback: 20
    atr_ratio_min: 0.8
    atr_mean_period: 50
    stop_atr: 2.0
    target_atr: 4.0
    exit_lookback: 10
  atr_period: 14

risk:
  risk_per_trade_pct: 1.0          # bornes 0,01 – 5
  max_position_pct: 25
  small_account_max_risk_pct: 3.0
  max_spread_to_stop: 0.25
  daily_loss_pct: 3.0
  max_drawdown_pct: 15.0           # bornes 1 – 50
  max_open_positions: 4
  max_forex_positions: 2
  max_trades_per_day: 10
  equity_drop_confirm_pct: 10.0    # chute à confirmer au cycle suivant

analysts:
  news_watch:
    event_window_min: 30
    high_impact_news_hours: 2
    shock_candle_atr: 3.0
    feed_max_bytes: 2097152        # CDC §8 : 2 Mo maximum
    feed_timeout_s: 20             # CDC §8 : 20 s maximum
    feeds:
      - https://www.coindesk.com/arc/outboundfeeds/rss/
      - https://cointelegraph.com/rss
      - https://www.federalreserve.gov/feeds/press_all.xml
      - https://www.ecb.europa.eu/rss/press.html
      - https://www.fxstreet.com/rss/news
    calendar_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json   # A9 (non officiel)
    refresh_minutes: 15            # flux et calendrier relus au plus toutes les 15 min
    announcement_impacts: [High]   # annonces « majeures » du calendrier
    high_impact_keywords:          # titre contenant l'un de ces mots = actualité à fort impact
      - hack
      - exploit
      - bankrupt
      - insolvency
      - delist
      - halt
      - emergency
      - rate decision
      - rate hike
      - rate cut
      - intervention
      - sanctions
      - war
      - default
      - SEC charges
      - ETF rejected
      - crash
  financial:
    resistance_atr: 0.5
    volatility_percentile_max: 97
    min_reward_risk: 1.2
    min_reward_risk_mean_reversion: 1.0
    trend_timeframe_hours: 4       # A6 : tendance de fond en 4 h (bougies 1 h agrégées)
    trend_ema: 50
    resistance_lookback: 50        # résistance / support = extrême des 50 dernières bougies
  risk:
    max_open_risk_pct: 5.0
    max_correlated_positions: 2
    loss_streak_market: 3
    loss_streak_market_pause_h: 24
    loss_streak_total: 5
    loss_streak_total_pause_h: 12
    min_equity: 50
    max_equity_drop_24h_pct: 5.0
    forex_weekend_start_utc: "fri 20:00"   # forex fermé du vendredi 20 h…
    forex_weekend_end_utc: "sun 22:15"     # …au dimanche 22 h 15 UTC (or compris, A4)
    correlation_groups:            # A5 : au plus 2 positions ouvertes par groupe
      crypto: [BTCUSDT, ETHUSDT, SOLUSDT]
      dollar: [EURUSD, GBPUSD, GOLD]
  ai:
    enabled: true
    model: claude-haiku-5-5
    min_reject_confidence: 0.70    # bornes 0,5 – 1 : l'IA ne fait que bloquer
    max_calls_decisions_per_day: 50
    max_calls_news_per_day: 24
    timeout_s: 20                  # sans réponse : les règles décident

engine:
  reconcile_every_cycles: 10       # CDC §6 : réconciliation tous les 10 cycles
  uncertain_order_pause_minutes: 30
  emergency_alert_every: 5         # alerte toutes les 5 tentatives d'arrêt d'urgence
  platform_reconnect_minutes: 5
  watchdog_minutes: 5              # alerte si aucun cycle depuis 5 min

reports:
  morning_utc: "07:00"             # format HH:MM, UTC
  audit_day: sun
  audit_utc: "18:00"

dashboard:
  port: 8080
  refresh_seconds: 10

storage:
  demo_db: data/tradebot_demo.db
  live_db: data/tradebot_live.db
  audits_dir: data/audits
