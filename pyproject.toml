[project]
name = "tradebot"
version = "2.0.0"
description = "Robot de trading crypto (Binance spot) et forex (Capital.com CFD)"
requires-python = ">=3.12"
dependencies = [
    # plafonnées à la version majeure actuelle (novembre 2026) : une nouvelle majeure
    # doit être testée avant d'être acceptée
    "httpx>=0.27,<1",
    "requests>=2.32.4,<3",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "fastapi>=0.115,<1",
    "starlette>=0.49.1,<2",
    "uvicorn>=0.30,<1",
    "python-telegram-bot>=21.0,<22",   # v21 imposée par CLAUDE.md
    "anthropic>=0.40,<3",
    "feedparser>=6.0,<7",
    "APScheduler>=3.10,<4",
    "structlog>=24.1,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "respx>=0.21,<1", "ruff==0.17.4", "mypy>=1.10,<3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# fichiers non Python embarqués dans le paquet (sinon absents de l'image Docker : page
# du tableau de bord en erreur 500, détecté par la CI « contrôle d'accès » sur le conteneur)
[tool.setuptools.package-data]
tradebot = ["interfaces/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]   # tests : données simulées partagées (binance_data, D8)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Règles figées (version de ruff figée dans les dépendances dev) : une mise à jour de ruff
# ne peut plus casser la CI sans changement de code.
select = ["E4", "E7", "E9", "F", "BLE", "C4", "UP", "RUF100"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
