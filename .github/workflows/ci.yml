# Intégration continue : garde-fous, lint, typage, tests + couverture, audit des dépendances,
# puis démarrage réel du conteneur et analyse de l'image.
# - push sur dev               → CI
# - pull request vers dev/prod → CI
# - push sur prod              → CI appelée par cd-prod.yml avant le déploiement
# Aucun test ne touche un vrai compte (réseau simulé par respx) — CLAUDE.md.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  UV_VERSION: "0.13.7"

jobs:
  garde-fous:
    name: Garde-fous (secrets, workflows, scripts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # gitleaks analyse tout l'historique
      - name: Aucun .env ni base SQLite versionné
        run: |
          interdits=$(git ls-files | grep -E '(^|/)\.env(\..+)?$|\.db$|\.db-(wal|shm)$' \
                      | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$interdits" ]; then
            echo "::error::Fichiers interdits dans le dépôt : $interdits"
            exit 1
          fi
      - name: Secrets dans le code et l'historique (gitleaks)
        continue-on-error: true      # DIAGNOSTIC (rendu bloquant ensuite)
        run: |
          rc=0
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --no-banner --redact -v > gitleaks.log 2>&1 || rc=$?
          body=$(tail -c 20000 gitleaks.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=gitleaks rc=$rc::$body"; exit $rc
      - name: Workflows GitHub (actionlint)
        continue-on-error: true      # DIAGNOSTIC
        run: |
          rc=0
          docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" -color \
            > actionlint.log 2>&1 || rc=$?
          body=$(tail -c 20000 actionlint.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=actionlint rc=$rc::$body"; exit $rc
      - name: Scripts shell (bash -n + shellcheck)
        continue-on-error: true      # DIAGNOSTIC
        run: |
          rc=0
          ( for f in deploy/*.sh; do bash -n "$f" || exit 1; done; shellcheck deploy/*.sh ) \
            > shell.log 2>&1 || rc=$?
          body=$(tail -c 20000 shell.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=shellcheck rc=$rc::$body"; exit $rc

  tests:
    name: Lint + typage + tests (Python 3.12)
    runs-on: ubuntu-24.04
    needs: garde-fous
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installation
        run: python -m pip install -e ".[dev]" "pytest-cov==7.1.0" "pip-audit==2.10.1" "uv==$UV_VERSION"
      - name: Fichiers de versions exactes (DIAGNOSTIC)
        continue-on-error: true
        run: |
          for extra in "" "--extra dev"; do
            out=$([ -z "$extra" ] && echo requirements.lock || echo requirements-dev.lock)
            uv pip compile pyproject.toml $extra --python-version 3.12 \
              --python-platform x86_64-unknown-linux-gnu --no-header --quiet -o "$out"
            body=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$out")
            echo "::notice title=$out::$body"
          done
      - name: Lint (ruff)
        run: ruff check --output-format=github src tests scripts
      - name: Typage (mypy)
        continue-on-error: true      # DIAGNOSTIC
        run: |
          rc=0; mypy src > mypy.log 2>&1 || rc=$?
          body=$(tail -c 30000 mypy.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=mypy rc=$rc::$body"; exit $rc
      - name: Tests (pytest + couverture)
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short --cov=tradebot --cov-report=term 2>&1 \
            | tee pytest.log
      - name: Nombre de tests et couverture visibles dans le résumé
        if: always()
        run: |
          [ -f pytest.log ] || exit 0
          echo "::notice title=pytest::$(tail -n 1 pytest.log)"
          body=$(sed -n '/coverage:/,/^TOTAL/p' pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=couverture::$body"
      - name: Échecs pytest visibles dans le résumé
        if: failure()
        run: |
          msg=$(grep -E '^(FAILED|ERROR) |^E  |^[^ ]+\.py:[0-9]+: ' pytest.log | head -80 \
                | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=pytest::${msg:-voir le journal du job}"
      - name: Dépendances vulnérables (pip-audit)
        continue-on-error: true      # DIAGNOSTIC
        run: |
          rc=0; pip-audit --progress-spinner off --skip-editable > audit.log 2>&1 || rc=$?
          body=$(tail -c 20000 audit.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=pip-audit rc=$rc::$body"; exit $rc

  docker:
    name: Docker (build, démarrage sans .env, analyse)
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - name: Compose valide
        run: |
          docker compose config -q
          # prod exige un .env : on valide avec un .env vide dans un dossier temporaire
          tmp=$(mktemp -d) && cp docker-compose.prod.yml "$tmp/" && touch "$tmp/.env"
          docker compose -f "$tmp/docker-compose.prod.yml" config -q
      - name: Build et démarrage comme un nouvel utilisateur (aucun .env)
        run: |
          test ! -f .env
          docker compose up -d --build
      - name: Le tableau de bord répond (/health = moteur vivant) et le conteneur est sain
        run: |
          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' tradebot 2>/dev/null || echo absent)
            if [ "$etat" = "healthy" ] && curl -fsS http://127.0.0.1:8080/health; then
              echo; echo "Conteneur sain"; exit 0
            fi
            echo "tentative $i : $etat"; sleep 5
          done
          echo "::error::Le conteneur ne devient pas sain"
          docker compose logs --tail 100
          exit 1
      - name: Le conteneur ne redémarre pas en boucle
        run: |
          test "$(docker inspect -f '{{.RestartCount}}' tradebot)" = "0"
          docker compose logs --tail 20
      - name: Analyse de l'image (Trivy, HIGH/CRITICAL corrigeables)
        continue-on-error: true      # DIAGNOSTIC
        run: |
          rc=0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress --format table tradebot:local > trivy.log 2>&1 || rc=$?
          body=$(tail -c 20000 trivy.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=trivy rc=$rc::$body"; exit $rc
      - name: Arrêt propre (SIGTERM)
        if: always()
        run: docker compose down -v
