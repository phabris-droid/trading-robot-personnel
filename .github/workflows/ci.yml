# Intégration continue : garde-fous, lint, typage, tests + couverture, audit des dépendances,
# puis démarrage réel du conteneur et analyse de l'image. Tous les contrôles sont bloquants.
# - push sur dev               → CI
# - pull request vers dev/prod → CI
# - push sur prod              → CI appelée par cd-prod.yml avant le déploiement
# Aucun test ne touche un vrai compte (réseau simulé par respx) — CLAUDE.md.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  UV_VERSION: "0.13.7"
  COVERAGE_MIN: "85"            # couverture mesurée : 89 % (novembre 2026)

jobs:
  garde-fous:
    name: Garde-fous (secrets, workflows, scripts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # gitleaks analyse tout l'historique
      - name: Aucun .env ni base SQLite versionné
        run: |
          interdits=$(git ls-files | grep -E '(^|/)\.env(\..+)?$|\.db$|\.db-(wal|shm)$' \
                      | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$interdits" ]; then
            echo "::error::Fichiers interdits dans le dépôt : $interdits"
            exit 1
          fi
      - name: Secrets dans le code et tout l'historique (gitleaks)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact -v
      - name: Workflows GitHub (actionlint + shellcheck des scripts intégrés)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" -color
      - name: Scripts shell (bash -n + shellcheck)
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          shellcheck deploy/*.sh

  tests:
    name: Lint + typage + tests (Python 3.12)
    runs-on: ubuntu-24.04
    needs: garde-fous
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Installation depuis les versions exactes
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest-cov==7.1.0" "pip-audit==2.10.1" "uv==$UV_VERSION"
      - name: Versions exactes cohérentes avec pyproject.toml
        run: |
          for spec in "requirements.lock|" "requirements-dev.lock|--extra=dev"; do
            lock="${spec%%|*}"; extra="${spec##*|}"
            cp "$lock" "/tmp/$lock"
            uv pip compile pyproject.toml ${extra:+"$extra"} --python-version 3.12 \
              --python-platform x86_64-unknown-linux-gnu --no-header --quiet -o "/tmp/$lock"
            if ! diff <(grep -v '^#' "$lock") <(grep -v '^#' "/tmp/$lock"); then
              echo "::error::$lock n'est plus cohérent avec pyproject.toml : le régénérer (uv pip compile)"
              exit 1
            fi
          done
      - name: Lint (ruff)
        run: ruff check --output-format=github src tests scripts
      - name: Typage (mypy)
        run: mypy src
      - name: Tests (pytest + couverture minimale)
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short --cov=tradebot --cov-report=term \
            --cov-fail-under="$COVERAGE_MIN" 2>&1 | tee pytest.log
      - name: Nombre de tests et couverture visibles dans le résumé
        if: always()
        run: |
          [ -f pytest.log ] || exit 0
          echo "::notice title=pytest::$(grep -E 'passed|failed' pytest.log | tail -n 1)"
          echo "::notice title=couverture::$(grep -E '^TOTAL' pytest.log || echo inconnue)"
      - name: Échecs pytest visibles dans le résumé
        if: failure()
        run: |
          [ -f pytest.log ] || exit 0
          msg=$(grep -E '^(FAILED|ERROR) |^E  |^[^ ]+\.py:[0-9]+: |Required test coverage' \
                pytest.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=pytest::${msg:-voir le journal du job}"
      - name: Dépendances vulnérables (pip-audit)
        run: pip-audit --progress-spinner off --skip-editable

  docker:
    name: Docker (build, démarrage sans .env, analyse)
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - name: Compose valide
        run: |
          docker compose config -q
          # prod exige un .env : on valide avec un .env vide dans un dossier temporaire
          tmp=$(mktemp -d) && cp docker-compose.prod.yml "$tmp/" && touch "$tmp/.env"
          docker compose -f "$tmp/docker-compose.prod.yml" config -q
      - name: Build et démarrage comme un nouvel utilisateur (aucun .env)
        run: |
          test ! -f .env
          docker compose up -d --build
      - name: Le tableau de bord répond (/health = moteur vivant) et le conteneur est sain
        run: |
          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' tradebot 2>/dev/null || echo absent)
            if [ "$etat" = "healthy" ] && curl -fsS http://127.0.0.1:8080/health; then
              echo; echo "Conteneur sain"; exit 0
            fi
            echo "tentative $i : $etat"; sleep 5
          done
          echo "::error::Le conteneur ne devient pas sain"
          docker compose logs --tail 100
          exit 1
      - name: Le conteneur ne redémarre pas en boucle
        run: |
          test "$(docker inspect -f '{{.RestartCount}}' tradebot)" = "0"
          docker compose logs --tail 20
      - name: Analyse de l'image (Trivy, HIGH/CRITICAL corrigeables)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress tradebot:local
      - name: Arrêt propre (SIGTERM)
        if: always()
        run: docker compose down -v
