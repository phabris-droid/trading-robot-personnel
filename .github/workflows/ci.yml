# Intégration continue : tests + lint + build Docker.
# Tourne sur chaque push et chaque pull request vers dev / prod / main.
# Aucun test ne touche un vrai compte (réseau simulé par respx) — CLAUDE.md.
name: CI

on:
  push:
    branches: [dev, main]   # prod : la CI est lancée par cd-prod.yml avant le déploiement
  pull_request:
    branches: [dev, prod, main]
  workflow_call:        # réutilisé par le pipeline de déploiement (cd-prod.yml)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  garde-fous:
    name: Garde-fous (secrets, fichiers interdits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucun .env ni base SQLite versionné
        run: |
          interdits=$(git ls-files | grep -E '(^|/)\.env(\..+)?$|\.db$|\.db-(wal|shm)$' \
                      | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$interdits" ]; then
            echo "::error::Fichiers interdits dans le dépôt : $interdits"
            exit 1
          fi
      - name: Recherche de secrets en clair
        run: |
          motifs='sk-ant-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -nE "$motifs" -- . ':!.github/workflows/*'; then
            echo "::error::Un secret semble présent dans le code. Le retirer et le révoquer."
            exit 1
          fi

  tests:
    name: Tests Python 3.12
    runs-on: ubuntu-latest
    needs: garde-fous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installation
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff) — informatif tant que le squelette n'est pas terminé
        continue-on-error: true
        run: ruff check src tests scripts
      - name: Tests (pytest)
        run: python -m pytest -q

  docker:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tradebot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
