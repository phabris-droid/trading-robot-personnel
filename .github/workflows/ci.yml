# Intégration continue : garde-fous, lint, tests, puis démarrage réel du conteneur.
# - push sur dev            → CI
# - pull request vers dev/prod → CI
# - push sur prod           → CI appelée par cd-prod.yml avant le déploiement
# Aucun test ne touche un vrai compte (réseau simulé par respx) — CLAUDE.md.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garde-fous:
    name: Garde-fous (secrets, fichiers interdits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Aucun .env ni base SQLite versionné
        run: |
          interdits=$(git ls-files | grep -E '(^|/)\.env(\..+)?$|\.db$|\.db-(wal|shm)$' \
                      | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$interdits" ]; then
            echo "::error::Fichiers interdits dans le dépôt : $interdits"
            exit 1
          fi
      - name: Recherche de secrets en clair
        run: |
          motifs='sk-ant-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -nE "$motifs" -- . ':!.github/workflows/*'; then
            echo "::error::Un secret semble présent dans le code. Le retirer et le révoquer."
            exit 1
          fi

  tests:
    name: Lint + tests (Python 3.12)
    runs-on: ubuntu-latest
    needs: garde-fous
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installation
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check --output-format=github src tests scripts
      - name: Tests (pytest)
        run: python -m pytest -q

  docker:
    name: Docker (build + démarrage sans .env)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - name: Compose valide
        run: |
          docker compose config -q
          # prod exige un .env : on valide avec un .env vide dans un dossier temporaire
          tmp=$(mktemp -d) && cp docker-compose.prod.yml "$tmp/" && touch "$tmp/.env"
          docker compose -f "$tmp/docker-compose.prod.yml" config -q
      - name: Build et démarrage comme un nouvel utilisateur (aucun .env)
        run: |
          test ! -f .env
          docker compose up -d --build
      - name: Le tableau de bord répond (/health) et le conteneur est sain
        run: |
          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' tradebot 2>/dev/null || echo absent)
            if [ "$etat" = "healthy" ] && curl -fsS http://127.0.0.1:8080/health; then
              echo; echo "Conteneur sain"; exit 0
            fi
            echo "tentative $i : $etat"; sleep 5
          done
          echo "::error::Le conteneur ne devient pas sain"
          docker compose logs --tail 100
          exit 1
      - name: Le conteneur ne redémarre pas en boucle
        run: |
          test "$(docker inspect -f '{{.RestartCount}}' tradebot)" = "0"
          docker compose logs --tail 20
      - name: Arrêt propre (SIGTERM)
        if: always()
        run: docker compose down -v
