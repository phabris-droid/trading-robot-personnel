# Intégration continue — 5 étapes, chaque contrôle est un point distinct et bloquant.
#
#   1. Analyse statique (en parallèle)    hygiène, secrets, workflows, scripts, lint, typage,
#                                         sécurité du code (règles bandit), configuration,
#                                         versions exactes, dépendances vulnérables
#   2. Tests (en parallèle)               6 domaines dont propriétés (hypothesis), tests isolés
#                                         (sans réseau, ordre aléatoire), couverture + oubliés
#   3. Conteneur (en parallèle)           build, démarrage, arrêt propre, durcissement,
#                                         secrets & contrôle d'accès, Trivy + SBOM
#   4. Préparation à la production        compose de prod + mode réel refusé, redémarrage
#                                         avec données conservées, répétition du déploiement
#                                         et du retour arrière
#   5. Verdict                            tableau récapitulatif, échoue si un point a échoué
#
# - push sur dev               → CI
# - pull request vers dev/prod → CI
# - push sur prod              → CI appelée par cd-prod.yml avant le déploiement
# Aucun test ne touche un vrai compte (réseau simulé par respx, vérifié sans réseau).
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  COVERAGE_MIN: "85"            # couverture mesurée : 89 % (novembre 2026)

jobs:
  # ════════════════════════ 1. ANALYSE STATIQUE ════════════════════════

  hygiene:
    name: 1 · Hygiène du dépôt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Aucun .env ni base SQLite versionné
        run: |
          interdits=$(git ls-files | grep -E '(^|/)\.env(\..+)?$|\.db$|\.db-(wal|shm)$' \
                      | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$interdits" ]; then
            echo "::error::Fichiers interdits dans le dépôt : $interdits"; exit 1
          fi
      - name: Aucun fichier volumineux (> 1 Mo)
        run: |
          gros=$(git ls-files -z | xargs -0 -r du -k | awk '$1 > 1024 {print $2}')
          if [ -n "$gros" ]; then echo "::error::Fichiers > 1 Mo : $gros"; exit 1; fi
      - name: .env.example sans valeur secrète
        run: |
          if grep -E '^(BINANCE_API_(KEY|SECRET)|CAPITAL_(API_KEY|PASSWORD)|TELEGRAM_BOT_TOKEN|ANTHROPIC_API_KEY|DASHBOARD_PASSWORD)=.+' .env.example; then
            echo "::error::.env.example contient une valeur secrète"; exit 1
          fi

  secrets:
    name: 1 · Secrets (gitleaks, tout l'historique)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact -v

  workflows:
    name: 1 · Workflows GitHub (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: actionlint + shellcheck des scripts intégrés
        run: |
          # sortie complète (y compris erreur fatale) recopiée en annotations
          rc=0
          docker pull -q "$ACTIONLINT_IMAGE" > /dev/null
          docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" -no-color \
            > actionlint.log 2>&1 || rc=$?
          cat actionlint.log
          if [ "$rc" != 0 ]; then
            while IFS= read -r ligne; do echo "::error::actionlint (code $rc) : $ligne"; done \
              < <(grep -v '^\s*$' actionlint.log | grep -v '^ *|' | head -40)
          fi
          exit "$rc"

  scripts:
    name: 1 · Scripts shell (bash -n, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Syntaxe (bash -n)
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck deploy/*.sh

  lint:
    name: 1 · Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-env
      - name: ruff
        run: ruff check --output-format=github src tests scripts

  typage:
    name: 1 · Typage (mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-env
      - name: mypy
        run: |
          # chaque erreur devient une annotation visible dans le résumé de l'exécution
          rc=0
          mypy src > mypy.log 2>&1 || rc=$?
          cat mypy.log
          grep -E '^[^:]+:[0-9]+: error:' mypy.log | head -10 | while IFS= read -r ligne; do
            fichier="${ligne%%:*}"; reste="${ligne#*:}"; numero="${reste%%:*}"
            echo "::error file=$fichier,line=$numero::$ligne"
          done
          exit "$rc"

  configuration:
    name: 1 · Configuration du robot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-env
      - name: config.yaml valide, garde-fous du mode réel actifs
        run: |
          python - <<'PY'
          import pathlib, tempfile, yaml
          from tradebot.settings import ConfigError, load_settings

          s = load_settings("config/config.yaml", env={})
          actifs = [f"{m.platform}:{m.symbol}:{m.strategy}" for m in s.markets if m.enabled]
          print(f"mode={s.mode}  marchés actifs={actifs}")
          if s.mode != "demo":
              print("::warning::config.yaml versionnée en mode RÉEL")
          raw = yaml.safe_load(pathlib.Path("config/config.yaml").read_text(encoding="utf-8"))
          raw["mode"] = "live"
          p = pathlib.Path(tempfile.mkdtemp()) / "live.yaml"
          p.write_text(yaml.safe_dump(raw), encoding="utf-8")
          for env in ({}, {"CONFIRM_LIVE_TRADING": "OUI", "DASHBOARD_PASSWORD": "court"}):
              try:
                  load_settings(p, env=env)
              except ConfigError:
                  continue
              raise SystemExit(f"le mode réel devrait être refusé avec {sorted(env)}")
          print("mode réel refusé sans CONFIRM_LIVE_TRADING=OUI et mot de passe ≥ 12 : OK")
          PY

  versions:
    name: 1 · Versions exactes (cohérence)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-env
      - name: requirements*.lock cohérents avec pyproject.toml
        run: |
          for spec in "requirements.lock|" "requirements-dev.lock|--extra=dev"; do
            lock="${spec%%|*}"; extra="${spec##*|}"
            cp "$lock" "/tmp/$lock"
            uv pip compile pyproject.toml ${extra:+"$extra"} --python-version 3.12 \
              --python-platform x86_64-unknown-linux-gnu --no-header --quiet -o "/tmp/$lock"
            if ! diff <(grep -v '^#' "$lock") <(grep -v '^#' "/tmp/$lock"); then
              echo "::error::$lock n'est plus cohérent avec pyproject.toml : le régénérer"; exit 1
            fi
          done

  dependances:
    name: 1 · Dépendances vulnérables (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-env
      - name: pip-audit (versions exactes)
        run: pip-audit --progress-spinner off --skip-editable

  securite-code:
    name: 1 · Sécurité du code (règles bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-env
      - name: ruff --select S (injections, mots de passe en dur, exceptions muettes…)
        run: ruff check --select S --output-format=github src

  # ════════════════════════ 2. TESTS ════════════════════════

  tests:
    name: 2 · Tests ${{ matrix.domaine }}
    needs: [lint, typage, configuration, versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - domaine: stratégies & risque
            id: strategies
            fichiers: tests/test_strategies_no_lookahead.py tests/test_risk.py tests/test_breakers.py
          - domaine: plateformes & exécution
            id: plateformes
            fichiers: tests/test_binance.py tests/test_capital.py tests/test_execution.py tests/test_reconciliation.py
          - domaine: journal & configuration
            id: journal
            fichiers: tests/test_journal.py tests/test_config.py
          - domaine: moteur (intégration, pannes)
            id: moteur
            fichiers: tests/test_engine.py tests/test_engine_integration.py
          - domaine: interface & sécurité
            id: interface
            fichiers: tests/test_dashboard.py tests/test_interfaces.py
          - domaine: équipe d'analyse
            id: analystes
            fichiers: tests/test_analysts.py
          - domaine: backtest & superviseur
            id: backtest
            fichiers: tests/test_backtest.py
          - domaine: propriétés (hypothesis)
            id: proprietes
            fichiers: tests/test_properties.py
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-env
      - name: pytest
        env:
          COVERAGE_FILE: coverage-${{ matrix.id }}.dat
          FICHIERS: ${{ matrix.fichiers }}
        run: |
          set -o pipefail
          # liste de fichiers volontairement découpée en arguments
          # shellcheck disable=SC2086
          python -m pytest -q -rfE --tb=short --cov=tradebot --cov-report= \
            --junitxml="junit-${{ matrix.id }}.xml" $FICHIERS 2>&1 | tee pytest.log
      - name: Résultat visible dans le résumé
        if: always()
        run: |
          [ -f pytest.log ] || exit 0
          echo "::notice title=${{ matrix.domaine }}::$(grep -E 'passed|failed' pytest.log | tail -n 1)"
      - name: Échecs visibles dans le résumé
        if: failure()
        run: |
          [ -f pytest.log ] || exit 0
          msg=$(grep -E '^(FAILED|ERROR) |^E  |^[^ ]+\.py:[0-9]+: ' pytest.log | head -80 \
                | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=${{ matrix.domaine }}::${msg:-voir le journal du job}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ matrix.id }}
          path: |
            coverage-${{ matrix.id }}.dat
            junit-${{ matrix.id }}.xml
          retention-days: 7

  tests-isoles:
    name: 2 · Tests isolés (sans réseau, ordre aléatoire)
    needs: [lint, typage, configuration, versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-env
      - name: Outils d'isolation
        run: python -m pip install "pytest-socket==0.8.1" "pytest-randomly==5.0.0"
      - name: Suite complète sans accès réseau, dans un ordre aléatoire
        run: |
          set -o pipefail
          # toute connexion réseau fait échouer le test : aucun test ne touche un vrai compte
          # pytest-randomly (chargé automatiquement) mélange l'ordre : graine dans le résumé
          python -m pytest -rfE --tb=short --disable-socket --allow-unix-socket \
            2>&1 | tee pytest.log
      - name: Résultat et graine visibles dans le résumé
        if: always()
        run: |
          [ -f pytest.log ] || exit 0
          echo "::notice title=tests isolés::$(grep -E 'passed|failed' pytest.log | tail -n 1) — $(grep -m1 -o "randomly-seed=[0-9]*" pytest.log || true)"

  couverture:
    name: 2 · Couverture combinée + tests oubliés
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-env
      - uses: actions/download-artifact@v7
        with:
          pattern: tests-*
          merge-multiple: true
      - name: Aucun fichier de test oublié par les domaines
        run: |
          python - <<'PY'
          import glob, subprocess, xml.etree.ElementTree as ET
          ran = 0
          for f in glob.glob("junit-*.xml"):
              root = ET.parse(f).getroot()
              suites = [root] if root.tag == "testsuite" else list(root)
              ran += sum(int(s.get("tests", 0)) for s in suites)
          out = subprocess.run(["python", "-m", "pytest", "--collect-only", "-q"],
                               capture_output=True, text=True).stdout
          total = sum(1 for line in out.splitlines() if "::" in line)
          print(f"tests exécutés par les domaines : {ran} / tests du dépôt : {total}")
          if ran != total:
              raise SystemExit(f"::error::{total - ran} test(s) ne sont rattachés à aucun domaine")
          PY
      - name: Couverture ≥ ${{ env.COVERAGE_MIN }} %
        run: |
          coverage combine coverage-*.dat
          coverage report --fail-under="$COVERAGE_MIN" | tee couverture.txt
          echo "::notice title=couverture::$(grep -E '^TOTAL' couverture.txt)"

  # ════════════════════════ 3. CONTENEUR ════════════════════════

  image:
    name: 3 · Build de l'image
    needs: [hygiene, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: docker-compose valides (local et prod)
        run: |
          docker compose config -q
          tmp=$(mktemp -d) && cp docker-compose.prod.yml "$tmp/" && touch "$tmp/.env"
          docker compose -f "$tmp/docker-compose.prod.yml" config -q
      - name: Build
        run: docker compose build
      - name: Image partagée avec les points suivants
        run: docker save tradebot:local | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  demarrage:
    name: 3 · Démarrage sans .env (/health = moteur vivant)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: image
      - name: Démarrage comme un nouvel utilisateur
        run: |
          gunzip -c image.tar.gz | docker load
          test ! -f .env
          docker compose up -d --no-build
      - name: Conteneur sain et moteur vivant
        run: |
          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' tradebot 2>/dev/null || echo absent)
            if [ "$etat" = "healthy" ] && curl -fsS --max-time 5 http://127.0.0.1:8080/health; then
              echo; echo "Conteneur sain"; exit 0
            fi
            echo "tentative $i : $etat"; sleep 5
          done
          echo "::error::Le conteneur ne devient pas sain"; docker compose logs --tail 100; exit 1
      - name: Pas de redémarrage en boucle, mode démo annoncé
        run: |
          test "$(docker inspect -f '{{.RestartCount}}' tradebot)" = "0"
          docker compose logs | grep -q "Robot démarré en mode DEMO"
      - name: Tableau de bord fermé sans mot de passe
        run: |
          code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          test "$code" = "503" || { echo "::error::/ répond $code au lieu de 503"; exit 1; }

  arret:
    name: 3 · Arrêt propre (SIGTERM)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: image
      - name: Démarrage
        run: |
          gunzip -c image.tar.gz | docker load
          docker compose up -d --no-build
          for _ in $(seq 1 30); do curl -fsS --max-time 5 http://127.0.0.1:8080/health && break; sleep 3; done
      - name: SIGTERM -> cycle terminé, sortie propre (code 0)
        run: |
          docker compose stop
          code=$(docker inspect -f '{{.State.ExitCode}}' tradebot)
          docker compose logs --tail 20
          test "$code" = "0" || { echo "::error::code de sortie $code"; exit 1; }
          docker compose logs | grep -q "Robot arrêté proprement"

  durcissement:
    name: 3 · Durcissement du conteneur (CDC §8)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: image
      - name: Démarrage
        run: |
          gunzip -c image.tar.gz | docker load
          docker compose up -d --no-build
      - name: Non-root, lecture seule, aucun privilège, mémoire limitée, port local
        run: |
          i() { docker inspect -f "$1" tradebot; }
          fail=0
          check() { if [ "$2" = "$3" ]; then echo "OK   $1"; else echo "::error::$1 : '$2' au lieu de '$3'"; fail=1; fi; }
          check "utilisateur non-root (uid 10001)" "$(i '{{.Config.User}}')" "10001"
          check "système de fichiers en lecture seule" "$(i '{{.HostConfig.ReadonlyRootfs}}')" "true"
          check "toutes les capacités retirées" "$(i '{{json .HostConfig.CapDrop}}')" '["ALL"]'
          check "no-new-privileges" "$(i '{{json .HostConfig.SecurityOpt}}')" '["no-new-privileges:true"]'
          check "mémoire limitée à 1 Go" "$(i '{{.HostConfig.Memory}}')" "1073741824"
          check "redémarrage automatique" "$(i '{{.HostConfig.RestartPolicy.Name}}')" "unless-stopped"
          check "port publié sur 127.0.0.1 seulement" \
            "$(i '{{(index (index .HostConfig.PortBindings "8080/tcp") 0).HostIp}}')" "127.0.0.1"
          check "contrôle de santé défini" "$(i '{{if .Config.Healthcheck}}oui{{end}}')" "oui"
          check "data/ seul dossier inscriptible (volume)" \
            "$(i '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Type}}{{end}}{{end}}')" "volume"
          exit "$fail"

  secrets-acces:
    name: 3 · Secrets jamais journalisés + contrôle d'accès
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: image
      - name: Démarrage avec de faux secrets (plateformes rendues injoignables)
        run: |
          gunzip -c image.tar.gz | docker load
          {
            echo "BINANCE_API_KEY=CLE$(openssl rand -hex 20)"
            echo "BINANCE_API_SECRET=SEC$(openssl rand -hex 24)"
            echo "CAPITAL_PASSWORD=PWD$(openssl rand -hex 12)"
            echo "TELEGRAM_BOT_TOKEN=TOK$(openssl rand -hex 16)"
            echo "ANTHROPIC_API_KEY=ANT$(openssl rand -hex 16)"
            echo "DASHBOARD_USER=admin"
            echo "DASHBOARD_PASSWORD=MDP$(openssl rand -hex 12)"
          } > /tmp/secrets.env
          # aucune requête vers les vraies plateformes depuis la CI
          mkdir -p /tmp/cfg && cp config/config.yaml /tmp/cfg/
          sed -i 's#https://[a-z.-]*binance[a-z.-]*#https://binance.invalid#g; s#https://[a-z.-]*capital[a-z.-]*#https://capital.invalid#g' /tmp/cfg/config.yaml
          docker run -d --name tradebot --env-file /tmp/secrets.env \
            -v /tmp/cfg:/app/config:ro --read-only --tmpfs /tmp \
            --tmpfs /app/data:uid=10001,gid=10001 -p 127.0.0.1:8080:8080 tradebot:local
          for _ in $(seq 1 30); do curl -fsS --max-time 5 http://127.0.0.1:8080/health && break; sleep 3; done
          sleep 5
      - name: Contrôle d'accès du tableau de bord (CDC §8)
        run: |
          pw=$(grep '^DASHBOARD_PASSWORD=' /tmp/secrets.env | cut -d= -f2)
          # identifiants jamais écrits en clair : mauvais mots de passe tirés au hasard
          bon="admin:$pw"
          faux1="admin:$(openssl rand -hex 8)"
          faux2="admin:$(openssl rand -hex 8)"
          code() { curl -s --max-time 5 -o /dev/null -w '%{http_code}' "$@"; }
          fail=0
          expect() { if [ "$2" = "$3" ]; then echo "OK   $1 ($2)"; else echo "::error::$1 : $2 au lieu de $3"; fail=1; fi; }
          expect "/health public" "$(code http://127.0.0.1:8080/health)" 200
          expect "sans identifiants" "$(code http://127.0.0.1:8080/)" 401
          expect "mauvais mot de passe" "$(code --user "$faux1" http://127.0.0.1:8080/)" 401
          expect "essai raté < 1 s après" "$(code --user "$faux2" http://127.0.0.1:8080/)" 429
          expect "bon mot de passe toujours accepté" "$(code --user "$bon" http://127.0.0.1:8080/)" 200
          expect "origine étrangère refusée" \
            "$(code -X POST --user "$bon" -H 'Origin: https://pirate.example' http://127.0.0.1:8080/api/status)" 403
          exit "$fail"
      - name: Aucun secret dans les journaux du conteneur ni dans le journal SQLite (CLAUDE.md règle 6)
        run: |
          docker logs tradebot > logs.txt 2>&1
          docker exec tradebot python -c "from tradebot.journal import Journal; [print(e['message']) for e in Journal('data/tradebot_demo.db', 'demo').events(1000)]" >> logs.txt 2>&1
          echo "--- extrait ---"; tail -n 15 logs.txt
          fail=0
          while IFS='=' read -r cle valeur; do
            [ "$cle" = "DASHBOARD_USER" ] && continue
            if grep -qF "$valeur" logs.txt; then echo "::error::$cle apparaît dans les journaux"; fail=1; fi
          done < /tmp/secrets.env
          exit "$fail"

  analyse-image:
    name: 3 · Vulnérabilités de l'image (Trivy) + SBOM
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: image
      - name: Chargement
        run: gunzip -c image.tar.gz | docker load
      - name: Trivy (HIGH/CRITICAL corrigeables)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress tradebot:local
      - name: Inventaire des composants (SBOM CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            "$TRIVY_IMAGE" image --format cyclonedx --output /out/sbom.cdx.json \
            --no-progress tradebot:local
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  # ════════════════════════ 4. PRÉPARATION À LA PRODUCTION ════════════════════════

  prod-config:
    name: 4 · Compose de production + mode réel refusé
    needs: [demarrage, durcissement]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: image
      - name: docker-compose.prod.yml exige un .env
        run: |
          gunzip -c image.tar.gz | docker load
          dir=$(mktemp -d) && cp docker-compose.prod.yml "$dir/"
          if docker compose -f "$dir/docker-compose.prod.yml" config -q 2>/dev/null; then
            echo "::error::la configuration de prod démarre sans .env"; exit 1
          fi
          echo "OK   .env obligatoire en production"
      - name: Démarrage avec la configuration de production
        run: |
          dir=$(mktemp -d) && cp docker-compose.prod.yml "$dir/"
          printf 'DASHBOARD_USER=admin\nDASHBOARD_PASSWORD=%s\n' "$(openssl rand -hex 12)" > "$dir/.env"
          TRADEBOT_IMAGE=tradebot:local docker compose -f "$dir/docker-compose.prod.yml" up -d
          for _ in $(seq 1 30); do curl -fsS --max-time 5 http://127.0.0.1:8080/health && exit 0; sleep 3; done
          docker logs tradebot --tail 50; exit 1
      - name: Journaux Docker limités (10 Mo × 5)
        run: |
          test "$(docker inspect -f '{{.HostConfig.LogConfig.Config}}' tradebot)" = "map[max-file:5 max-size:10m]"
      - name: Mode réel refusé dans le conteneur sans confirmation ni mot de passe solide
        run: |
          mkdir -p /tmp/live && cp config/config.yaml /tmp/live/
          sed -i 's/^mode: demo/mode: live/' /tmp/live/config.yaml
          grep -q '^mode: live' /tmp/live/config.yaml
          doit_refuser() {
            local rc=0
            docker run --rm "$@" -v /tmp/live:/app/config:ro tradebot:local > out.txt 2>&1 || rc=$?
            cat out.txt
            test "$rc" = "2" || { echo "::error::le mode réel aurait dû être refusé (code $rc)"; exit 1; }
            grep -q "Démarrage refusé" out.txt
          }
          doit_refuser                                            # aucune confirmation
          doit_refuser -e CONFIRM_LIVE_TRADING=OUI -e DASHBOARD_PASSWORD=court   # mot de passe faible

  redemarrage:
    name: 4 · Redémarrage (données conservées, CDC §10 J4)
    needs: [demarrage, arret]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: image
      - name: Démarrage
        run: |
          gunzip -c image.tar.gz | docker load
          docker compose up -d --no-build
          for _ in $(seq 1 30); do curl -fsS --max-time 5 http://127.0.0.1:8080/health && break; sleep 3; done
      - name: Journal relu avant et après « docker compose restart »
        run: |
          compte() {
            docker compose exec -T tradebot python -c \
              "from tradebot.journal import Journal; j = Journal('data/tradebot_demo.db', 'demo'); print(len(j.events(100000)))"
          }
          avant=$(compte); echo "événements avant : $avant"
          test "$avant" -ge 1
          docker compose restart
          for _ in $(seq 1 30); do curl -fsS --max-time 5 http://127.0.0.1:8080/health && break; sleep 3; done
          apres=$(compte); echo "événements après : $apres"
          test "$apres" -ge "$avant" || { echo "::error::données perdues au redémarrage"; exit 1; }
          test "$(docker inspect -f '{{.RestartCount}}' tradebot)" = "0"

  repetition-deploiement:
    name: 4 · Répétition du déploiement + retour arrière
    needs: [demarrage, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: image
      - name: Préparer une bonne image et une image cassée (moteur qui ne démarre pas)
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag tradebot:local tradebot:bonne
          printf 'FROM tradebot:local\nCMD ["sleep", "infinity"]\n' | docker build -q -t tradebot:cassee -
          dir=$(mktemp -d) && cp docker-compose.prod.yml "$dir/" && touch "$dir/.env"
          echo "APP_DIR=$dir" >> "$GITHUB_ENV"
      - name: Déploiement de la bonne image (deploy/deploy_remote.sh)
        run: TRADEBOT_IMAGE=tradebot:bonne HEALTH_DELAY=3 bash deploy/deploy_remote.sh
      - name: Déploiement d'une image cassée -> échec ET retour automatique
        run: |
          if TRADEBOT_IMAGE=tradebot:cassee HEALTH_TRIES=8 HEALTH_DELAY=3 bash deploy/deploy_remote.sh; then
            echo "::error::le déploiement d'une image cassée aurait dû échouer"; exit 1
          fi
          image=$(docker inspect -f '{{.Config.Image}}' tradebot)
          test "$image" = "tradebot:bonne" || { echo "::error::image en service : $image"; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:8080/health
          test "$(cat "$APP_DIR/.deployed_image")" = "tradebot:bonne"
          echo; echo "OK   retour automatique à la version précédente"

  # ════════════════════════ 5. VERDICT ════════════════════════

  verdict:
    name: 5 · Verdict
    if: always()
    needs: [hygiene, secrets, workflows, scripts, lint, typage, securite-code, configuration,
            versions, dependances, tests, tests-isoles, couverture, image, demarrage, arret,
            durcissement, secrets-acces, analyse-image, prod-config, redemarrage,
            repetition-deploiement]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Tableau récapitulatif
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Verdict de la CI"
            echo
            echo "| Point | Résultat |"
            echo "|---|---|"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then "✅" else "❌ \(.value.result)" end) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          ko=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$ko" ]; then echo "::error::Points en échec : $ko"; exit 1; fi
          echo "Tous les points sont verts"
