# Mise en ligne : push sur prod → CI complète → image publiée sur GHCR → VPS.
#
# Le VPS n'a besoin que de Docker et d'un fichier /opt/tradebot/.env :
# le pipeline y copie docker-compose.prod.yml, télécharge l'image et relance le robot.
# Le .env n'est jamais transmis ; le volume de données (bases SQLite) est conservé.
#
# Secrets à créer dans Settings → Environments → production :
#   VPS_HOST         ex. 213.156.135.38
#   VPS_USER         ex. trader (membre du groupe docker)
#   VPS_SSH_KEY      clé privée dédiée au déploiement (ed25519)
#   VPS_KNOWN_HOSTS  sortie de : ssh-keyscan -t ed25519 213.156.135.38
# Variable facultative : VPS_APP_DIR (défaut /opt/tradebot)
# Tant que ces secrets manquent, l'image est publiée mais le déploiement est sauté
# (avertissement dans le résumé du pipeline).
name: CD prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false     # ne jamais interrompre un déploiement en cours

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publication de l'image (GHCR)
    needs: ci
    # sécurité : un lancement manuel depuis une autre branche ne publie ni ne déploie rien
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write          # signature de l'attestation de provenance
      attestations: write
    outputs:
      image: ${{ steps.nom.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - name: Nom de l'image en minuscules
        id: nom
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # 1. construite UNE fois, chargée localement : c'est cette image exacte qui sera testée
      #    puis déployée (par son empreinte sha256)
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.nom.outputs.image }}:prod
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 2. Démarrage de l'image candidate (sans .env, /health)
        env:
          REF: ${{ steps.nom.outputs.image }}:${{ github.sha }}
        run: |
          docker run -d --name candidate --read-only --tmpfs /tmp \
            --tmpfs /app/data:uid=10001,gid=10001 -p 127.0.0.1:8080:8080 "$REF"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/health; then echo; docker rm -f candidate; exit 0; fi
            sleep 3
          done
          docker logs --tail 80 candidate; exit 1
      - name: 3. Analyse de vulnérabilités (Trivy, HIGH/CRITICAL corrigeables)
        env:
          REF: ${{ steps.nom.outputs.image }}:${{ github.sha }}
        # sécurité : image d'outil figée par empreinte, lecture de l'archive (jamais le socket
        # Docker : un outil compromis pourrait sinon modifier l'image avant sa publication)
        run: |
          docker save "$REF" -o /tmp/candidate.tar
          docker run --rm -v /tmp/candidate.tar:/image.tar:ro \
            aquasec/trivy:0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6 \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress
          rm -f /tmp/candidate.tar
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 4. Publication de l'image testée
        id: push
        env:
          IMG: ${{ steps.nom.outputs.image }}
        run: |
          docker push "$IMG:${GITHUB_SHA}"
          docker push "$IMG:prod"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMG:${GITHUB_SHA}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "sha=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "Image publiée : \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: 5. Attestation de provenance signée (image <- ce dépôt, ce commit, ce pipeline)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.nom.outputs.image }}
          subject-digest: ${{ steps.push.outputs.sha }}
          push-to-registry: true

  deploy:
    name: Déploiement sur le VPS
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/tradebot' }}
      IMAGE_REF: ${{ needs.publish.outputs.digest }}   # image testée, par empreinte
    steps:
      - name: Secrets du VPS configurés ?
        id: check
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          K: ${{ secrets.VPS_SSH_KEY }}
          KH: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          manquants=""
          [ -z "$H" ] && manquants="$manquants VPS_HOST"
          [ -z "$U" ] && manquants="$manquants VPS_USER"
          [ -z "$K" ] && manquants="$manquants VPS_SSH_KEY"
          [ -z "$KH" ] && manquants="$manquants VPS_KNOWN_HOSTS"
          if [ -n "$manquants" ]; then
            echo "::warning::Déploiement sauté : secrets manquants dans l'environnement production :$manquants"
            echo "### ⚠️ Déploiement sauté" >> "$GITHUB_STEP_SUMMARY"
            echo "Image publiée : \`$IMAGE_REF\`. Secrets manquants :$manquants" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'

      - name: Préparer SSH
        if: steps.check.outputs.ok == 'true'
        env:
          K: ${{ secrets.VPS_SSH_KEY }}
          KH: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KH" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Copier docker-compose.prod.yml
        if: steps.check.outputs.ok == 'true'
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          OPTS=(-i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          printf 'mkdir -p %q\n' "$APP_DIR" | ssh "${OPTS[@]}" "$U@$H" "bash -s"
          scp "${OPTS[@]}" docker-compose.prod.yml "$U@$H:$APP_DIR/"

      - name: Télécharger l'image et relancer le robot (retour arrière si KO)
        if: steps.check.outputs.ok == 'true'
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          OPTS=(-i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          # Variables et jeton GHCR passés par l'entrée standard (jamais dans une ligne de
          # commande distante, visible dans la liste des processus du VPS) ; le script est
          # deploy/deploy_remote.sh, répété à chaque CI (« Répétition du déploiement »)
          {
            printf 'APP_DIR=%q\nTRADEBOT_IMAGE=%q\nGHCR_USER=%q\nGHCR_TOKEN=%q\n' \
              "$APP_DIR" "$IMAGE_REF" "$GHCR_USER" "$GHCR_TOKEN"
            cat deploy/deploy_remote.sh
          } | ssh "${OPTS[@]}" "$U@$H" "bash -s"

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/id_deploy
