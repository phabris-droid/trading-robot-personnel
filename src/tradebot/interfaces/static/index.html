<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tradebot</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e6e6e6; --muted:#9aa3b2;
          --green:#1f7a3a; --red:#b3261e; --up:#3fb950; --down:#f85149; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: var(--bg);
         color: var(--text); max-width: 1100px; margin-inline: auto; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { padding: .35rem .9rem; border-radius: 6px; font-weight: 800; letter-spacing: .05em; }
  .demo { background: var(--green); } .live { background: var(--red); }
  .statut { padding: .3rem .7rem; border: 1px solid var(--line); border-radius: 6px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
          margin: 12px 0; }
  .card, section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
                   padding: 10px; }
  .card b { display: block; font-size: 1.3rem; margin-top: 4px; }
  .muted { color: var(--muted); font-size: .85rem; }
  section { margin: 12px 0; overflow-x: auto; }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  .pos { color: var(--up); } .neg { color: var(--down); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  button { font: inherit; padding: .7rem 1.1rem; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button.danger { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }
  svg { width: 100%; height: 180px; display: block; }
  #erreur { color: var(--down); }
</style>
</head>
<body>
<header>
  <span id="mode" class="badge demo">DÉMO</span>
  <span id="statut" class="statut">—</span>
  <span id="maj" class="muted"></span>
  <span id="erreur"></span>
</header>

<div class="grid" id="capitaux"></div>

<div class="actions">
  <button id="pause">Pause</button>
  <button id="reprendre">Reprendre</button>
  <button id="urgence" class="danger">ARRÊT D'URGENCE</button>
</div>

<section><h2>Courbe du capital (7 jours)</h2><svg id="courbe" viewBox="0 0 600 180"
  preserveAspectRatio="none" role="img" aria-label="Courbe du capital"></svg></section>
<section><h2>Positions ouvertes</h2><table id="positions"></table></section>
<section><h2>50 derniers trades</h2><table id="trades"></table></section>
<section><h2>Journal d'événements</h2><table id="evenements"></table></section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fmt = (n, d = 2) => (n === null || n === undefined) ? "—" : Number(n).toFixed(d);
const heure = (ts) => new Date(ts * 1000).toISOString().replace("T", " ").slice(5, 16) + " UTC";
const txt = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));

function table(el, head, rows) {
  el.innerHTML = "<tr>" + head.map((h) => `<th>${txt(h)}</th>`).join("") + "</tr>" +
    (rows.length ? rows.map((r) => "<tr>" + r.map((c) => `<td>${c}</td>`).join("") + "</tr>").join("")
                 : `<tr><td colspan="${head.length}" class="muted">aucun</td></tr>`);
}

function courbe(points) {
  const svg = $("courbe");
  if (points.length < 2) { svg.innerHTML = '<text x="10" y="90" fill="#9aa3b2">pas encore de données</text>'; return; }
  const xs = points.map((p) => p.ts), ys = points.map((p) => p.value);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sx = (x) => (x - x0) / ((x1 - x0) || 1) * 590 + 5;
  const sy = (y) => 170 - (y - y0) / ((y1 - y0) || 1) * 160;
  const d = points.map((p, i) => (i ? "L" : "M") + sx(p.ts).toFixed(1) + " " + sy(p.value).toFixed(1)).join(" ");
  const couleur = ys[ys.length - 1] >= ys[0] ? "#3fb950" : "#f85149";
  svg.innerHTML = `<path d="${d}" fill="none" stroke="${couleur}" stroke-width="2"/>` +
    `<text x="5" y="12" fill="#9aa3b2" font-size="11">${fmt(y1)}</text>` +
    `<text x="5" y="178" fill="#9aa3b2" font-size="11">${fmt(y0)}</text>`;
}

async function charger() {
  try {
    const r = await fetch("/api/state", {credentials: "same-origin", cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const s = await r.json();
    if (Number.isFinite(s.rafraichissement_s) && s.rafraichissement_s >= 2) delaiMs = s.rafraichissement_s * 1000;
    const live = s.mode === "live";
    $("mode").textContent = live ? "RÉEL" : "DÉMO";
    $("mode").className = "badge " + (live ? "live" : "demo");
    $("statut").textContent = s.statut;
    $("maj").textContent = "mis à jour " + heure(s.maintenant);
    $("erreur").textContent = "";
    const cartes = Object.entries(s.capital).map(([k, v]) =>
      `<div class="card"><span class="muted">Capital ${txt(k)}</span><b>${fmt(v)}</b></div>`);
    const p = s.pnl;
    cartes.push(`<div class="card"><span class="muted">Capital total</span><b>${fmt(s.capital_total)}</b></div>`);
    cartes.push(`<div class="card"><span class="muted">P&amp;L jour / 7 jours</span><b class="${p.jour >= 0 ? "pos" : "neg"}">${fmt(p.jour)} / ${fmt(p.sept_jours)}</b></div>`);
    cartes.push(`<div class="card"><span class="muted">Réussite (7 j, ${p.trades_7j} trades)</span><b>${p.reussite_pct === null ? "—" : fmt(p.reussite_pct, 1) + " %"}</b></div>`);
    $("capitaux").innerHTML = cartes.join("");
    courbe(s.courbe);
    table($("positions"), ["Marché", "Sens", "Quantité", "Entrée", "Stop", "Objectif", "Plateforme"],
      s.positions.map((x) => [txt(x.market), txt(x.side), fmt(x.qty, 6), fmt(x.entry, 5),
                              fmt(x.stop, 5), fmt(x.target, 5), txt(x.platform)]));
    table($("trades"), ["Date", "Marché", "Sens", "Quantité", "Entrée", "Sortie", "P&L"],
      s.trades.map((t) => [heure(t.ts), txt(t.market), txt(t.side), fmt(t.qty, 6), fmt(t.entry, 5),
                           fmt(t.exit, 5), `<span class="${t.pnl >= 0 ? "pos" : "neg"}">${fmt(t.pnl)}</span>`]));
    table($("evenements"), ["Date", "Niveau", "Message"],
      s.evenements.map((e) => [heure(e.ts), txt(e.level), txt(e.message)]));
  } catch (err) {
    $("erreur").textContent = "Robot injoignable : " + err.message;
  }
}

async function action(chemin, corps) {
  const r = await fetch(chemin, {method: "POST", credentials: "same-origin",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(corps || {})});
  if (!r.ok) alert("Échec : HTTP " + r.status);
  charger();
}

$("pause").onclick = () => confirm("Mettre les nouvelles entrées en pause ?") && action("/api/pause");
$("reprendre").onclick = () => confirm("Reprendre les nouvelles entrées ?") && action("/api/reprendre");
$("urgence").onclick = () => confirm("ARRÊT D'URGENCE : fermer TOUTES les positions ?") &&
  confirm("Confirmer une seconde fois l'arrêt d'urgence ?") && action("/api/urgence", {confirmer: true});

// K6 : délai de rafraîchissement lu dans config.yaml (dashboard.refresh_seconds) via /api/state
let delaiMs = 10000;
async function boucle() {
  await charger();
  setTimeout(boucle, delaiMs);
}
boucle();
</script>
</body>
</html>
